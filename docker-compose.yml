version: '1.1'

services:
  wwt-api:
    container_name: wwt-api
    restart: always
    image: node:20.19.6
    ports:
      - '4001:3007'
    volumes:
      - ./:/usr/src/wwt
    working_dir: /usr/src/wwt
    networks:
      - monorepo-network

    command: bash -c "rm -rf dist && npm install && npm run build && npm run start:prod"

  wwt-batch:
    container_name: wwt-batch
    restart: unless-stopped
    image: node:20.19.6
    ports:
      - '4002:3008'
    volumes:
      - ./:/usr/src/wwt
    working_dir: /usr/src/wwt
    networks:
      - monorepo-network

    command: bash -c "npm install && npm run build && npm run start:prod:batch"

networks:
  monorepo-network:
    driver: bridge
